name: daily-signal

on:
  schedule:
    - cron: '30 9 * * 1-5'   # 北京时间 17:30（收盘后数据源更新完）
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  signal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python daily_signal.py
      - name: Commit and push daily update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "daily: $(date -u +%F) 数据与信号更新"
          git push
